schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

context: |
  Tech stack: Java 21, Spring Boot 4.1.1 (Maven), Spring Data JPA, Spring Security, Spring Web MVC
  Persistence: PostgreSQL 16 (Alpine), run locally via docker/docker-compose.yml (container expensegate-db, db/user/password: expensegate)
  Local dev DB connection: jdbc:postgresql://localhost:5432/expensegate
  Base package: academy.jairo.expensegate
  Build tool: Maven wrapper (mvnw/mvnw.cmd)
  Domain: expense management / gateway ("expense gate")
  Package structure per feature: academy.jairo.expensegate.<feature>.{entity,repository,service,controller}
    (e.g. academy.jairo.expensegate.expense.entity, .repository, .service, .controller)

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
