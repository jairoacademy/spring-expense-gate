spring.application.name=spring-expense-gate

# DataSource configuration for local Dockerized PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/expensegate
spring.datasource.username=expensegate
spring.datasource.password=expensegate
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate settings suitable for local development
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false